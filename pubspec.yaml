name: jodeals
description: "JO-Dealz - deals and offers in Jordan."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.0.21+27

environment:
  sdk: ^3.10.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  webview_flutter: ^4.8.0
  webview_flutter_wkwebview: ^3.25.1
  webview_flutter_android: ^4.12.0
  webview_flutter_platform_interface: ^2.15.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  connectivity_plus: ^7.3.1
  url_launcher: ^6.2.5
  app_links: ^7.2.1
  flutter_svg: ^2.0.10
  permission_handler: ^11.3.1
  google_fonts: ^6.1.0
  http: ^1.2.1
  cached_network_image: ^3.3.1
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  shared_preferences: ^2.2.3
  image_picker: ^1.2.2
  google_sign_in: ^7.2.0
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.3.1
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.9.0
  flutter_ringtone_player: ^4.0.0+4
  video_player: ^2.8.2
  sign_in_with_apple: ^7.0.1
  firebase_crashlytics: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app-icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app-icon-foreground.png"

flutter_native_splash:
  color: "#F8FAFC"
  color_dark: "#0F172A"
  image: "assets/images/app-icon.png"
  android_12:
    color: "#F8FAFC"
    color_dark: "#0F172A"
    image: "assets/images/app-icon.png"
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/
    - assets/fonts/

  # Bundled so text renders offline and no runtime requests go to Google
  # (GoogleFonts.config.allowRuntimeFetching = false in main.dart).
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
